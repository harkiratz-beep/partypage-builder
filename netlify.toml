[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set these in Site configuration > Environment variables:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   NEXT_PUBLIC_SITE_URL          (your real https:// origin — share links/OG)
#   SUPABASE_SERVICE_ROLE_KEY     (required — host area; server-side only)
#   HOST_PASSWORD                 (required — admin password; no default, never committed)
#
# Optional:
#   HOST_USERNAME / GUEST_USERNAME (defaults: admin / guest)
#   SESSION_SECRET                 (defaults to a key derived from the service role key)
